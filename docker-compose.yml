services:
  mysql:
    image: mysql:8.0
    container_name: panchavati_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: panchavati_hotel
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: panchavati_server
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: panchavati_hotel
      DB_USER: root
      DB_PASS: root
      DB_SYNC_ALTER: "true"
      JWT_SECRET: panchavati_nashik_secret_key_change_this_in_prod
      CLIENT_URL: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - server_uploads:/app/server/uploads

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: panchavati_client
    restart: always
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  mysql_data:
  server_uploads: